name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Chạy khi bạn push vào branch main

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: 18


      - name: Install and Build 🔧
        run: |
          npm install
          npm run build
        env:
          # Truyền các biến Supabase vào lúc build
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # Thư mục chứa code sau khi build
          branch: gh-pages # Branch dùng để host web
